<details class="flex flex-col gap-2" open>
  <summary class="text-xs font-semibold tracking-[0.18em] text-slate-200 uppercase">
    {{ title() }}
  </summary>
  @if (navItems$ | async; as items) {
    <ul class="flex flex-col gap-1 text-sm">
      @for (item of items; track item.url ?? item.name) {
        <li>
          <a
            class="text-tokyo-accent-cyan hover:text-tokyo-accent-orange"
            [routerLink]="item.routerLink ?? item.url"
            [queryParams]="item.queryParams ?? null"
          >
            {{ item.name | titlecase }}
          </a>
        </li>
      }
    </ul>
  }
</details>
