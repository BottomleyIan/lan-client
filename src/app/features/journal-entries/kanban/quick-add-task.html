<app-icon-button-primary
  icon="taskPlus"
  label="Quick add task"
  [disabled]="!canQuickAdd()"
  (pressed)="openQuickAdd()"
/>
<app-dialog
  #quickAddDialog
  [labelledById]="'quick-add-title'"
  [describedById]="'quick-add-description'"
  (closed)="closeQuickAdd()"
  (cancelled)="closeQuickAdd()"
>
  <div class="flex items-start justify-between gap-4 px-5 pt-5">
    <h2 class="text-lg font-semibold text-slate-100" id="quick-add-title">Quick add task</h2>
    <app-icon-button-danger icon="x" label="Close dialog" (pressed)="closeQuickAdd()" />
  </div>
  <div class="flex flex-col gap-3 px-5 pb-5">
    <label class="sr-only text-sm font-semibold text-slate-100" for="quick-add-input">Task</label>
    <input
      #quickAddInput
      uiInput
      id="quick-add-input"
      type="text"
      placeholder="What needs doing?"
      [formControl]="quickAddControl"
      [disabled]="isSaving()"
      [attr.aria-invalid]="quickAddControl.invalid && quickAddControl.touched ? true : null"
    />
    <div class="flex justify-end gap-2">
      <app-icon-button-primary
        icon="check"
        label="Confirm quick add"
        [disabled]="quickAddControl.invalid || isSaving()"
        (pressed)="confirmQuickAdd()"
      />
    </div>
  </div>
</app-dialog>
