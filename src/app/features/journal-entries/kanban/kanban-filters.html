<div class="flex items-center gap-3 text-sm font-semibold text-slate-100">
  <label class="sr-only" for="task-tag-filter">Tag</label>
  <input
    uiInput
    id="task-tag-filter"
    type="text"
    placeholder="Type a tag"
    [formControl]="tagControl"
    [attr.list]="tagOptions().length > 0 ? 'task-tag-options' : null"
    class="w-56"
  />
  <label class="sr-only" for="task-priority-filter">Priority</label>
  <select uiInput id="task-priority-filter" [formControl]="priorityControl" class="w-40">
    @for (option of priorityOptions; track option.value) {
      <option [value]="option.value">{{ option.label }}</option>
    }
  </select>
  <app-icon-button-primary
    icon="taskPlus"
    label="Quick add task"
    [disabled]="!canQuickAdd()"
    (pressed)="openQuickAdd()"
  />
</div>
@if (tagOptions().length > 0) {
  <datalist id="task-tag-options">
    @for (tag of tagOptions(); track tag) {
      <option [value]="tag"></option>
    }
  </datalist>
}
<app-dialog
  #quickAddDialog
  [labelledById]="'quick-add-title'"
  [describedById]="'quick-add-description'"
  (closed)="closeQuickAdd()"
  (cancelled)="closeQuickAdd()"
>
  <div class="flex items-start justify-between gap-4 px-5 pt-5">
    <div>
      <h2 class="text-lg font-semibold text-slate-100" id="quick-add-title">Quick add task</h2>
      <p class="text-sm text-slate-400" id="quick-add-description">
        Adds a TODO with medium priority in the current tag.
      </p>
    </div>
    <app-icon-button-danger icon="x" label="Close dialog" (pressed)="closeQuickAdd()" />
  </div>
  <div class="flex flex-col gap-3 px-5 pb-5">
    <label class="text-sm font-semibold text-slate-100" for="quick-add-input">Task</label>
    <input
      #quickAddInput
      uiInput
      id="quick-add-input"
      type="text"
      placeholder="What needs doing?"
      [formControl]="quickAddControl"
      [disabled]="isSaving()"
      [attr.aria-invalid]="quickAddControl.invalid && quickAddControl.touched ? true : null"
    />
    <div class="flex justify-end gap-2">
      <app-icon-button-danger
        icon="x"
        label="Cancel quick add"
        [disabled]="isSaving()"
        (pressed)="closeQuickAdd()"
      />
      <app-icon-button-primary
        icon="check"
        label="Confirm quick add"
        [disabled]="quickAddControl.value.trim().length === 0 || isSaving()"
        (pressed)="confirmQuickAdd()"
      />
    </div>
  </div>
</app-dialog>
