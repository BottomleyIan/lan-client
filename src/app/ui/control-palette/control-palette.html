@if (isOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-start justify-center bg-black/40 p-4 pt-24 backdrop-blur-xs"
    (click)="handleBackdropClick()"
  >
    <om-flickering-grid
      [gridGap]="3"
      [squareSize]="8"
      class="pointer-events-none absolute inset-0"
    />
    <section
      class="bg-tokyo-surface-1/95 z-10 w-full max-w-xl rounded-2xl border border-white/10 p-4 shadow-2xl"
      role="dialog"
      aria-modal="true"
      aria-labelledby="control-palette-title"
      (click)="handlePanelClick($event)"
    >
      <h2 id="control-palette-title" class="sr-only">Control palette</h2>
      @if (mode() === 'command') {
        <input
          #inputEl
          class="focus:border-tokyo-accent-cyan w-full rounded-lg border border-white/10 bg-slate-900/80 px-4 py-3 text-sm text-slate-100 outline-none placeholder:text-slate-400"
          type="text"
          placeholder="Type a command…"
          list="control-palette-commands"
          [value]="query()"
          (input)="handleInput($event)"
          (keydown)="handleKeydown($event)"
        />
        <datalist id="control-palette-commands">
          @for (command of commandOptions(); track command) {
            <option [value]="command"></option>
          }
        </datalist>
      } @else {
        <textarea
          #textareaEl
          class="focus:border-tokyo-accent-cyan min-h-[160px] w-full resize-none rounded-lg border border-white/10 bg-slate-900/80 px-4 py-3 text-sm text-slate-100 outline-none placeholder:text-slate-400"
          placeholder="Write a note…"
          [value]="query()"
          [disabled]="isSaving()"
          (input)="handleInput($event)"
          (keydown)="handleKeydown($event)"
        ></textarea>
      }
      @if (mode() === 'command' && filteredCommands().length > 0) {
        <ul class="mt-3 flex flex-col gap-2 text-sm text-slate-200">
          @for (command of filteredCommands(); track command.id) {
            <li class="rounded-lg border border-white/5 bg-white/5 px-3 py-2">
              {{ command.label }}
            </li>
          }
        </ul>
      }
    </section>
  </div>
}
