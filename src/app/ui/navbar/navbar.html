<header
  class="relative z-10 my-2 flex shrink-0 items-center justify-between gap-12 text-2xl text-slate-100"
>
  <div class="flex items-center gap-3 text-nowrap">
    <a
      routerLink="/"
      aria-label="Home"
      class="text-tokyo-accent-orange hover:text-tokyo-accent-cyan focus-visible:ring-2 focus-visible:ring-cyan-400/70 focus-visible:outline-none"
    >
      <svg viewBox="0 0 640 640" class="h-6 w-6" fill="currentColor" aria-hidden="true">
        <path
          d="M341.8 72.6C329.5 61.2 310.5 61.2 298.3 72.6L74.3 280.6C64.7 289.6 61.5 303.5 66.3 315.7C71.1 327.9 82.8 336 96 336L112 336L112 512C112 547.3 140.7 576 176 576L464 576C499.3 576 528 547.3 528 512L528 336L544 336C557.2 336 569 327.9 573.8 315.7C578.6 303.5 575.4 289.5 565.8 280.6L341.8 72.6zM304 384L336 384C362.5 384 384 405.5 384 432L384 528L256 528L256 432C256 405.5 277.5 384 304 384z"
        />
      </svg>
    </a>
    @switch (titleMode()) {
      @case ('calendar-month') {
        <app-calendar-month-title />
      }
      @case ('calendar-day') {
        <app-calendar-day-title />
      }
      @default {
        <h1
          class="font-vt323 font-black tracking-[0.14em] uppercase drop-shadow-[0_0_12px_rgba(34,211,238,0.25)]"
        >
          {{ title() }}
        </h1>
        <span class="text-xs tracking-[0.14em] text-slate-400 uppercase">{{ subtitle() }}</span>
      }
    }
  </div>
  @if (isTasksRoute()) {
    <div class="flex min-w-0 flex-1 justify-start">
      <app-kanban-filters />
    </div>
  }
  @if (isNotesRoute()) {
    <div class="flex min-w-0 flex-1 justify-start">
      <app-notes-tag-filter />
    </div>
  }
  <nav class="flex items-center gap-3" aria-label="Primary">
    <ul class="flex items-center gap-3">
      <app-nav-link
        routerLink="/playlists"
        label="Playlist"
        iconName="playlist"
        [srOnly]="true"
        [showSkipLink]="true"
      />
      <app-nav-link
        routerLink="/music-filter"
        label="Music Filter"
        iconName="musicFilter"
        [srOnly]="true"
        [showSkipLink]="true"
      />
      <app-nav-link
        routerLink="/albums"
        label="Albums"
        iconName="album"
        [srOnly]="true"
        [showSkipLink]="true"
      />
      <app-nav-link
        routerLink="/artists"
        label="Artist"
        iconName="artist"
        [srOnly]="true"
        [showSkipLink]="true"
      />
      <app-tasks-button />
      <app-nav-link
        routerLink="/notes/{{ currentYear() }}/{{ currentMonth() }}"
        label="Calendar"
        iconName="calendar"
        [srOnly]="true"
        [showSkipLink]="true"
      />
      <app-journal-entry-add-button />
      <app-nav-link
        routerLink="/files"
        [exact]="true"
        label="Files"
        iconName="files"
        [srOnly]="true"
        [showSkipLink]="true"
      />
      <app-settings-button />
    </ul>
  </nav>
</header>
