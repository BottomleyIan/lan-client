<dialog
  #dialogEl
  class="fixed inset-0 flex size-auto max-h-none max-w-none flex-col gap-3 overflow-y-auto bg-transparent backdrop:bg-transparent"
  [class.hidden]="!isOpen()"
  aria-modal="true"
  [attr.aria-labelledby]="labelledById()"
  [attr.aria-describedby]="describedById()"
  (close)="handleClose()"
  (cancel)="handleCancel($event)"
>
  <div
    class="fixed inset-0 bg-black/40 p-4 pt-24 backdrop-blur-xs"
    (click)="handleBackdropClick()"
  ></div>
  @if (isOpen()) {
    <om-flickering-grid
      [gridGap]="3"
      [squareSize]="8"
      class="pointer-events-none absolute inset-0"
    />
  }

  <div
    tabindex="-1"
    class="flex min-h-full items-end justify-center text-center focus:outline-none sm:items-center sm:p-0"
    (click)="handleBackdropClick()"
  >
    <div
      class="bg-tokyo-surface-2 relative transform overflow-hidden rounded-lg p-4 text-left shadow-xl outline -outline-offset-1 outline-white/10 transition-all data-closed:translate-y-4 data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in data-[state=closing]:scale-95 data-[state=closing]:opacity-0 sm:my-8 sm:w-full sm:max-w-lg data-closed:sm:translate-y-0 data-closed:sm:scale-95"
      [attr.data-state]="backdropState()"
      (click)="handleContentClick($event)"
    >
      <div class="relative z-10">
        <ng-content />
      </div>
    </div>
  </div>
</dialog>
